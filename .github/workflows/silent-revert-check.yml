name: Silent revert check

# Did the merge that just landed quietly delete work an earlier PR added?
#
# This repo squash-merges, so `check:merge-survival` -- which interrogates a MERGE
# COMMIT and asserts every identifier either parent introduced survives -- never
# runs on the thing that actually ships. A branch based before PR A, squashed
# after it, carries the old tree forward: clean merge, no conflict, every check
# green, and A is gone.
#
# It is not hypothetical and it is not rare. On 2026-08-26 alone:
#   #1248 removed four files and two flags belonging to three merged PRs
#   #1267 removed four more flags, restored by #1277 an hour later
#   #1249 changed a timeout back, which nothing noticed for hours
# Each was found by a person happening to look. `audit:silent-reverts` exists for
# exactly this and, until now, ran nowhere -- the same failure #724 records for
# check:overlay-scroll, which had gone red on main and nobody knew.
#
# PUSH-TRIGGERED rather than scheduled, unlike the other drift workflows. Drift in
# a database appears at an unknown time, so you poll for it. A silent revert
# appears at a KNOWN one -- the merge -- and the useful report names that merge
# while its author is still around. A schedule would tell you at 07:20 tomorrow.
#
# NOT a build gate, for the reason the other drift checks record: this is a
# property of HISTORY, not of the checkout. No PR can cause or cure a revert that
# has not happened yet, so failing `npm run build` would block unrelated authors
# on a condition they cannot affect.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # Grouped by SHA, never by ref. `check:ci-cancel` exists because the opposite
  # was believed here: cancel-in-progress:false protects a run already IN
  # PROGRESS, while GitHub cancels a still-PENDING run unconditionally when a
  # newer one joins its group. Sharing one group across main pushes is what
  # BUILDS the queue that makes a run cancellable -- and a cancelled run reports
  # no failure, so the merge would read as checked by something that never ran.
  # That is the precise defect this workflow exists to catch, so being subject to
  # it would be its own joke.
  group: silent-revert-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reverts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # THE WHOLE THING TURNS ON THIS. actions/checkout defaults to depth 1,
          # and the audit would then walk ONE commit, track what it added, find
          # nothing missing, and report green having asked almost nothing. The
          # script refuses a short walk under --fail-on-silent for that reason,
          # so a regression here fails loudly rather than passing silently.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No npm install: the script shells out to git and reads the working tree.
      # It keeps working when the build is broken, which is when a bad merge is
      # most likely to have landed.
      - name: Did this merge delete what an earlier PR added?
        # --ref HEAD, not origin/main: a push run checks out the pushed commit and
        # has no remote-tracking branch to compare against.
        #
        # 80 commits because the window must reach the ADDING commit, not just the
        # removing one. #1239 was reverted by #1267 TWENTY-SEVEN commits later; a
        # 12-commit window reports clean on that exact history. Measured.
        #
        # --fail-on-silent is opt-in and narrower than "any finding": it fires on a
        # SILENT definition removal, or on one commit removing files added by
        # SEVERAL different commits -- the stale-base fingerprint. A single-file
        # removal never trips it, because over 500 commits every hit of that rule
        # was a PROMOTION, and a gate that argues with correct work gets ignored.
        run: node scripts/audit-silent-reverts.mjs --ref HEAD --commits 80 --fail-on-silent
