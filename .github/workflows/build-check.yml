name: Build check

on:
  pull_request:
    branches: [main, master]

# A new push to the same PR makes an in-flight run obsolete.
concurrency:
  group: build-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The three static side guards share ONE job (owner, 2026-11-13). They used to be three jobs,
  # each paying checkout + setup + `npm ci` for a few seconds of work, and every PR push started
  # 20 jobs against the free plan's ~20-runner pool -- measured, these jobs ran ~0.4 min and
  # waited ~26 min for a runner, and the required `build` waited in the same queue. Each guard is
  # still its own named STEP, and `if: success() || failure()` runs every step even after an
  # earlier one fails, so one failure never hides another. None of them is in `npm run build`:
  # migration-claims needs the network and a token, and a local build must never depend on
  # GitHub being reachable.
  side-guards:
    name: Migration claims, overlay absence, merge survival
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both migration-claims (diffs this branch's migrations against the base) and
          # merge-survival (diffs both parents against their merge base) need history that a
          # shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Migration numbers are unclaimed
        run: node scripts/check-migration-claims.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Static -- no browser, no database, no secrets -- but ~10s, nearly all of it Babel parsing
      # two 400kB JSX files. `maskComments` needs a real parse because POSITION is the question: a
      # regex comment-strip ate real code when this repo tried it. A build-chain guard is paid by
      # every author on every build, so that cost belongs here rather than in `npm run build`.
      #
      # What it protects: two overlays shipped telling a climber they had nothing when a read had
      # merely failed (#1276 Inbox, #1287 friends list). The other nine were then read and
      # explained. All of that is a SNAPSHOT -- a new overlay with a DB-backed empty state would be
      # caught only if somebody remembered to re-run a probe in scripts/oneoff/, which nothing
      # executes.
      - name: No overlay reads a failed read as an empty account
        if: success() || failure()
        run: node scripts/check-overlay-absence.mjs

      # A `pull_request` checkout IS merge(head, base), so HEAD here is exactly the merge this
      # guard exists to interrogate: did resolving it silently delete something either side had
      # added? Git mis-merges this repo's dense single-line files without conflicting, and #482
      # and #776 both shipped that way -- clean merge, green CI, merged work quietly un-shipped.
      - name: A merge kept everything both sides added
        if: success() || failure()
        run: node scripts/check-merge-survival.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # package-lock.json is committed, so install exactly what it pins.
      - run: npm ci

      # These two run as their own steps so a failure reads as "Rules of hooks
      # failed" in the checks list instead of hiding inside a build log. They are
      # idempotent, and `npm run build` below runs them again along with the rest.
      - name: Undefined references
        run: npm run check:refs
      - name: Rules of hooks
        run: npm run check:hooks

      # `npm run build`, NOT `npx vite build`. This step used to call the bundler
      # directly on the reasoning that "the two guards above already ran" — true
      # when the chain was two guards long. It is now eleven, so calling vite
      # directly meant nine of them ran only on main, after merge:
      #   schema-drift, crew-ready, log-hydration, zindex, disc-labels,
      #   write-feedback, boot-shell, session-claims, a11y-names
      # A guard that first fires after the merge does not prevent the merge. The
      # newest of them, check:a11y-names (#613), would never have run on a PR at
      # all. Keep this in step with deploy.yml, which also runs `npm run build`:
      # whatever gates production must gate the pull request.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          # deploy.yml sets this, so without it here the PR compiles a different
          # app than production and any code behind the flag is never gated.
          VITE_DEMO_AUTOLOGIN: "true"
