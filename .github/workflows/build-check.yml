name: Build check

on:
  pull_request:
    branches: [main, master]

# A new push to the same PR makes an in-flight run obsolete.
concurrency:
  group: build-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # package-lock.json is committed, so install exactly what it pins.
      - run: npm ci

      # These two run as their own steps so a failure reads as "Rules of hooks
      # failed" in the checks list instead of hiding inside a build log. They are
      # idempotent, and `npm run build` below runs them again along with the rest.
      - name: Undefined references
        run: npm run check:refs
      - name: Rules of hooks
        run: npm run check:hooks

      # `npm run build`, NOT `npx vite build`. This step used to call the bundler
      # directly on the reasoning that "the two guards above already ran" — true
      # when the chain was two guards long. It is now eleven, so calling vite
      # directly meant nine of them ran only on main, after merge:
      #   schema-drift, crew-ready, log-hydration, zindex, disc-labels,
      #   write-feedback, boot-shell, session-claims, a11y-names
      # A guard that first fires after the merge does not prevent the merge. The
      # newest of them, check:a11y-names (#613), would never have run on a PR at
      # all. Keep this in step with deploy.yml, which also runs `npm run build`:
      # whatever gates production must gate the pull request.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          # deploy.yml sets this, so without it here the PR compiles a different
          # app than production and any code behind the flag is never gated.
          VITE_DEMO_AUTOLOGIN: "true"
