name: Render guards

# Six checks that ask "does this reach a screen, and reach it correctly?" — a question
# the static guards in build-check.yml cannot answer, because all six need the app
# rendered.
#
# Why they need CI at all. All were hand-run only, and on 2026-08-09 that failed
# exactly the way you would predict: check:overlay-scroll had gone RED on main and
# nobody knew. Three full-screen states of the guide application sheet scrolled the
# page behind them (#724). Nothing reported it, because nothing ran it. A guard that
# only runs when somebody remembers is a guard you do not have.
#
# check:ui was the last one still in that position, and it is the broadest of them
# — 20 screens, asserting nothing blanked, no uncaught page errors, no
# NaN/undefined/[object Object] in rendered copy, and that named sections survive.
# It sat outside CI because it was too flaky to gate on, and both causes are now
# fixed rather than tolerated: #464 made it claim a genuinely free port instead of
# adopting whatever answered 5190, and #742 made it settle on the text having
# stopped changing instead of polling for two of the app's thirteen spinners.
#
# Deliberately its own workflow, not steps in build-check.yml — the same reasoning
# zero-state.yml records. These render a real app, so they are slower and flakier
# than a Babel pass, and a flake here must not read as "the build is broken" nor
# block a deploy, which is why none of them appear in deploy.yml.
#
# Independent jobs rather than steps, so a browser flake in one cannot stop the
# others from reporting.
#
# They run on push to main as well as on pull_request, because a green PR is not a
# statement about main. A pull_request run tests merge(head, base) as base stood WHEN
# THE RUN STARTED, so two PRs that are each green can still break main between them —
# and that is not hypothetical here: #728 and #727 merged three seconds apart, both
# green, and main stopped building. check:migration-claims now catches that one
# collision; nothing catches the general case, because until now no browser guard had
# ever been run against main. The failure would surface on the NEXT unrelated PR,
# attributed to whoever opened it.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  # On a PR, group by branch so a new push supersedes the run it replaces. On a push,
  # `head_ref` is empty and this falls through to `github.sha`, which is UNIQUE per commit
  # — so main runs never share a group and never queue behind one another.
  #
  # That is not the same guarantee `cancel-in-progress` gives, and the difference is the
  # whole point of this line. `cancel-in-progress: false` only protects a run that is
  # already IN PROGRESS. GitHub cancels a still-PENDING run unconditionally when a newer
  # run joins its group, and the comment below was written believing otherwise.
  #
  # Measured, on this workflow: run 31644233526, event `push`, sha 7fb4e65. 18e6265's run
  # sat pending for 15 minutes (created 21:33:48, started 21:48:44); 7fb4e65's was created
  # 21:48:58 and correctly went pending behind it; 9d441d3's was created 21:50:48 and
  # 7fb4e65's was CANCELLED at 21:50:50, two seconds later. It reported no failure, so
  # #835's merge read as checked by a guard that had never run on it — the exact failure
  # the note below claims to prevent. Sharing one group across main pushes is what built
  # the queue that made it cancellable, so per-SHA groups are the fix, not a stricter flag.
  #
  # Cost: main pushes now run in parallel rather than serially. That is the price of
  # actually checking each merge, and it is the right trade — a check that is skipped is
  # worth less than a runner minute.
  group: render-guards-${{ github.head_ref || github.sha }}
  # Cancel superseded PR runs; never cancel a main run. #616 is the reason: with
  # cancel-in-progress on, merges killed each other's deploys and production sat eight
  # commits behind for five hours. Cancelling here would be quieter and worse — a
  # cancelled run reports no failure, so the merge that was never checked would look
  # checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  overlay-scroll:
    name: Overlays contain their own scroll
    runs-on: ubuntu-latest
    # A hung dev server or a browser that never launches should fail in minutes,
    # not sit for the default six hours.
    # 50 overlays since the scaffold's discovery was widened (was 28).
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Fail here, with a readable message, rather than inside playwright's launcher.
      # playwright-core downloads no browser; it drives the Google Chrome that ships
      # on the ubuntu-latest image. That is the only reason this can run in CI.
      - name: Confirm a browser is present
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is not on this runner, so check:overlay-scroll cannot drive anything."
            echo "The repo depends on playwright-core, which ships no browser. Either pin a runner"
            echo "image that includes Chrome, or add a browser install step here."
            exit 1
          fi
          google-chrome --version

      - name: Overlay scroll containment
        run: npm run check:overlay-scroll
        env:
          # Match zero-state.yml. Without these USE_DB is off and the app under test
          # is not the one that ships, so a pass would say nothing about production.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          VITE_DEMO_AUTOLOGIN: "true"

  ui-walk:
    name: The app renders on every screen
    runs-on: ubuntu-latest
    # It walks 20 screens, opens interactive state and drills into a route detail's
    # sub-tabs. Measured at 5m35s locally when it walked 17; the three Crew sub-views
    # add a little. The 25 minutes below is headroom for a slower runner, not an
    # expected duration.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Confirm a browser is present
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is not on this runner, so check:ui cannot drive anything."
            echo "The repo depends on playwright-core, which ships no browser. Either pin a runner"
            echo "image that includes Chrome, or add a browser install step here."
            exit 1
          fi
          google-chrome --version

      - name: Walk every screen
        run: npm run check:ui -- --snapshot ui-screens.json
        env:
          # Match zero-state.yml. Without these USE_DB is off and check:ui walks the
          # seed catalog instead of the DB one — a different app than production, and
          # it would silently switch its sample route to the seed spelling and pass.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          VITE_DEMO_AUTOLOGIN: "true"

      # The failure line names the screen and the offending text; the surrounding copy
      # is what tells you whether it is a real bug. Same reasoning as zero-state.yml.
      - name: Upload per-screen text
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screens
          path: ui-screens.json
          if-no-files-found: warn

  a11y-badges:
    name: No control announces a glued count
    runs-on: ubuntu-latest
    # 50 overlays since #748 widened the scaffold's discovery (was 28). This check shares
    # that discovery, so it inherited the wider walk — and the longer runtime with it.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Confirm a browser is present
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is not on this runner, so check:a11y-badges cannot drive anything."
            echo "The repo depends on playwright-core, which ships no browser. Either pin a runner"
            echo "image that includes Chrome, or add a browser install step here."
            exit 1
          fi
          google-chrome --version

      - name: Badge counts stay out of accessible names
        run: npm run check:a11y-badges
        env:
          # Same reasoning as overlay-scroll above: without these USE_DB is off and the
          # app under test is not the one that ships.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          VITE_DEMO_AUTOLOGIN: "true"

  anniversary:
    name: The anniversary notification still fires
    runs-on: ubuntu-latest
    # One screen and two overlays, so it is the quickest of these.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Confirm a browser is present
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is not on this runner, so check:anniversary cannot drive anything."
            echo "The repo depends on playwright-core, which ships no browser. Either pin a runner"
            echo "image that includes Chrome, or add a browser install step here."
            exit 1
          fi
          google-chrome --version

      - name: A qualifying log produces an anniversary
        run: npm run check:anniversary
        env:
          # Same reasoning as overlay-scroll above: without these USE_DB is off and the
          # app under test is not the one that ships.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          VITE_DEMO_AUTOLOGIN: "true"

  field-renders:
    name: Enriched columns reach a screen
    runs-on: ubuntu-latest
    # A healthy run is ~85s. The headroom is for the degraded case: each of the 45 column
    # queries now retries up to 3 times, and the failure being retried is a 57014 statement
    # timeout, so a wholesale-slow Supabase costs three timeouts per column before the run
    # gives up. At the 3s anon ceiling that is ~7min; a cold connection costs 3.8-6.4s (see
    # the note in CLAUDE.md) and 15 was too tight against that. It only ever fails closed
    # after spending this, so the budget buys a correct verdict, never a false pass.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Every enriched column reaches a screen
        run: npm run check:field-renders
        env:
          # Read-only, and the ANON key on purpose — `routes` and `areas` are publicly
          # readable, CI has no business holding a key that bypasses RLS, and a checker
          # that could write is a checker that can corrupt what it is checking. Same
          # stance as area-count-drift.yml.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  horizontal-overflow:
    name: The app fits a 390px phone
    runs-on: ubuntu-latest
    # Walks the same 6 tabs and ~43 openable overlays as its siblings; measured at ~6m
    # locally, so this is headroom rather than an expected duration.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Confirm a browser is present
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is not on this runner, so check:overflow cannot measure anything."
            exit 1
          fi
          google-chrome --version

      - name: Nothing runs off the right-hand edge
        run: npm run check:overflow
        env:
          # Same reasoning as the jobs above: without these USE_DB is off and the app
          # under test is not the one that ships.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          VITE_DEMO_AUTOLOGIN: "true"

  challenge-rows:
    name: Tick-list rows say something true
    runs-on: ubuntu-latest
    # Opens ONE panel and expands ONE card, so it is much shorter than its siblings.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Confirm a browser is present
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is not on this runner, so check:challenge-rows cannot measure anything."
            exit 1
          fi
          google-chrome --version

      - name: The Challenges list panel renders real rows
        run: npm run check:challenge-rows
        env:
          # Same reasoning as the jobs above: without these USE_DB is off and the app
          # under test is not the one that ships.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
