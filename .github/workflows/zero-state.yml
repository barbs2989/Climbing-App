name: Zero state

# Walks the app as a brand-new account sees it (npm run check:zero).
#
# Deliberately its own workflow rather than a step in build-check.yml. This drives a
# real browser, so it is slower and more prone to flaking than the static guards, and a
# flake here must not read as "the build is broken" — nor block a deploy, which is why
# it is absent from deploy.yml for the same reason check:ui is.
#
# It needs no browser install: the ubuntu-latest runner image ships Google Chrome, which
# is what playwright-core's channel:"chrome" drives. That is the whole reason this can
# run in CI at all — playwright-core downloads no browser of its own.

# Walks main as well (on a schedule since 2026-11-13), for the reason render-guards.yml records at length: a
# pull_request run tests the base as it stood when that run started, so nothing here
# has ever been a statement about main itself.

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      # Files no walk reads and the built app does not contain. A PR or merge touching ONLY
      # these cannot change what any screen renders, so walking it costs ~16 browser jobs
      # against the PRODUCTION database for no new evidence. Measured 2026-11-04/05: about a
      # third of PRs were data/audit/doc-only, and the walks are the load that stalled the
      # project (pg_stat_statements: the signed-in boot RPCs ran ~1,760 times in 3.6 h, all
      # CI). Verified then: no walk script, nor anything it imports, reads these paths or any
      # .md file; the app names them only in comments. Everything else (app code, lib/, src/,
      # other scripts/, supabase/, package*.json, .github/) still runs every walk. Branch
      # protection requires only `build`, so a skipped walk blocks nothing.
      - "audits/**"
      - "research-data/**"
      - "research/**"
      - "catalog/**"
      - "enrichment-wip/**"
      - "gear-research/**"
      - "docs/**"
      - "**.md"
      - "scripts/oneoff/**"
      - "scripts/pipeline/**"
      - "scripts/enrich/**"
      - "scripts/audit-*.mjs"
  # Main on a four-hour timer instead of every merge: see render-guards.yml's `on:` block.
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

concurrency:
  # On a PR, group by branch so a new push supersedes the run it replaces. On a push,
  # `head_ref` is empty and this falls through to `github.sha`, which is UNIQUE per commit
  # — so main runs never share a group and never queue behind one another.
  #
  # That last part is load-bearing and `cancel-in-progress` alone does NOT achieve it.
  # `cancel-in-progress: false` only protects a run that is already IN PROGRESS; GitHub
  # cancels a still-PENDING run unconditionally when a newer run joins its group. Measured
  # on run 31644233526 — a push run for 7fb4e65 that went pending behind a 15-minute queue
  # and was cancelled two seconds after the next merge's run was created. It reported no
  # failure, so #835's merge read as checked by a guard that never ran on it. Sharing one
  # group across main pushes is what created the queue that made it cancellable.
  group: zero-state-${{ github.head_ref || github.sha }}
  # Superseded PR runs are cancellable; a main run is not. A cancelled run reports no
  # failure, so cancelling here would make an unchecked merge look checked (#616).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  zero-state:
    runs-on: ubuntu-latest
    # A hung dev server or a browser that never launches should fail in minutes, not
    # sit for the default six hours.
    # 50 overlays since the scaffold's discovery was widened (was 28), and an overlay that
    # never mounts costs six navigations before it gives up, not one.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fail here, with a readable message, rather than inside playwright's launcher.
      - name: Confirm a browser is present
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome is not on this runner, so check:zero cannot drive anything."
            echo "The repo depends on playwright-core, which ships no browser. Either pin a runner"
            echo "image that includes Chrome, or add a browser install step here."
            exit 1
          fi
          google-chrome --version

      - name: Zero state
        run: node scripts/ci-db-inconclusive.mjs npm run check:zero -- --dump zero-state.json
        env:
          # Match build-check.yml and deploy.yml. Without these USE_DB is off and the
          # Climbs tab renders AreaView instead of DbAreaBrowser — a different app than
          # production, so a pass would say nothing about what ships.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          VITE_DEMO_AUTOLOGIN: "true"

      # The failure message names the screen and the offending text, but the surrounding
      # copy is usually what tells you whether it is a real bug.
      - name: Upload per-screen text
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zero-state-screens
          path: zero-state.json
          if-no-files-found: warn
