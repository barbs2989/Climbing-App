name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling them. With cancel-in-progress: true, a push that
# lands while a build is running kills that build -- and the build takes ~5 min. On
# 2026-08-06 several sessions merged every 3-6 min and five runs were cancelled mid-build
# (f0cb2bc, e6def23, 29c60cd, cf917ef, 84705a7), each by the next merge, so none reached
# the publish step. Cancelling only saves time when the superseded run is worthless; here
# it IS the deploy, so the saved minutes cost the publish entirely.
#
# Not the whole story that day -- Actions and Pages were also in a major outage, which is
# what failed the runs that did get as far as deploy-pages@v4. This change would not have
# saved that; it addresses the cancellations, which are ours and recur whenever merges
# outpace the build.
#
# Queueing costs a little latency when merges are rapid (each run waits for the one
# ahead) and is otherwise identical: the last run to finish still publishes the newest
# commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci`, not `npm install`. package-lock.json is committed, but `npm
      # install` re-resolves the `^` ranges (vite ^5.4.0, @supabase/supabase-js
      # ^2.109.0, react ^18.3.1), so production could build against dependency
      # versions no pull request ever compiled. build-check.yml already uses
      # `npm ci`; production had the looser one. The cache also cuts the build,
      # which is what widened the window #616's queueing change addressed.
      - run: npm ci
      # A missing secret does not fail the build, it changes the app. Vite folds
      # an unset import.meta.env.VITE_* to undefined, so lib/supabase.js leaves
      # `supabase` null, USE_DB goes false, and the site ships happily serving the
      # in-memory seed catalog instead of Supabase. With VITE_DEMO_AUTOLOGIN on it
      # looks entirely healthy — it just isn't the real catalogue. Fail loudly.
      - name: Require the Supabase secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing — refusing to deploy a build that would silently fall back to the seed catalog"
            exit 1
          fi
          echo "supabase secrets present"
      # Catches identifiers referenced but never bound — the bug class that has
      # blank-screened production twice (PRs #317, #359). No linter here, and the
      # bundler happily builds them.
      - run: npm run check:refs
      # Catches hooks called conditionally, after an early return, or from an
      # event handler. A hook in a handler throws at click time without
      # unmounting, so the control silently does nothing (PR #377).
      - run: npm run check:hooks
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_USE_DB: "true"
          # Keep the deployed app browsable without an account. #584 made the demo
          # gate opt-IN (VITE_DEMO_AUTOLOGIN) and left it unset here, which silently
          # turned production into signup-required: a first-time visitor got a
          # sign-in box and could not see a single climb. Whether the app gates on a
          # real account is a product decision, and the recorded one is to stay open.
          VITE_DEMO_AUTOLOGIN: "true"
      # The run_attempt suffix is required — artifact names must be unique within
      # a run, so a bare "github-pages" collides on the second attempt. It does
      # mean this workflow must be re-run WHOLE:
      #     gh run rerun <id>          correct — build re-uploads under attempt N
      #     gh run rerun <id> --failed WRONG — reruns only the failed deploy job,
      #                                which then resolves github-pages-<id>-<N+1>
      #                                while the good artifact is still named
      #                                ...-<id>-<N>, and dies on a missing artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
