# Dependency update PRs. Minor and patch bumps arrive as ONE grouped PR a week, so the queue
# stays readable; each MAJOR bump arrives alone, because a major is a decision (see the notes in
# scripts/check-action-versions.mjs) and needs its own build to prove it. Security fixes are
# opened as soon as GitHub publishes the advisory, whatever the schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # axe-core is held at 4.10.3. 4.14 turns label-content-name-mismatch from experimental into a
    # gated WCAG rule, and check:axe then reports 215 nodes across the app (2026-11-14, after the
    # grouped bump #3118). Lift this once those accessible names are fixed in their own pass.
    ignore:
      - dependency-name: axe-core

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
