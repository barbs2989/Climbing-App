<!-- Maskable variant of favicon.svg, for Android's adaptive-icon crop. It cannot simply be
     favicon.svg tagged `purpose: "maskable"`, and shipping it that way was the defect this
     file fixes. Two differences, both required by the maskable contract:

       1. The background is FULL BLEED — no `rx`. The launcher supplies the shape (circle,
          squircle, rounded square). A pre-rounded tile inside that mask reads as a smaller
          badge floating on the launcher's background, with the tile's own transparent
          corners showing through.

       2. The glyph is scaled to sit inside the safe zone, which is the central circle of
          80% the icon's width — radius 9.6 in this 24 viewBox, NOT the inner 80% square.
          A square's corners fall at radius ~13.6 and are croppable. The mark is a wide
          triangle whose lower corners are its farthest points, so it is the diagonal, not
          the width, that sets the scale.

     The scale below is not asserted from arithmetic — scripts/oneoff/render-app-icons.mjs
     measures the rendered pixels and fails if any painted pixel lands outside that circle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="ClimbMatch">
  <rect width="24" height="24" fill="#0d1117"/>
  <!-- translate = 12 - 12*scale, which centres the path's 2..22 / 3..21 bbox on the
       viewBox centre so the safe circle is measured from the right origin. -->
  <g transform="translate(4.8 4.8) scale(0.6)">
    <path d="m8 3 4 8 5-5 5 15H2L8 3z" fill="none" stroke="#2f81f7" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
