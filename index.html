<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ClimbMatch</title>
    <!-- Icons + install metadata. %BASE_URL% (not a bare "/") because Pages serves the
         app from /Climbing-App/ — see `base` in vite.config.js. Until 2026-08-09 the app
         declared no icon at all: no tab icon, no home-screen icon, nothing for an installer.
         That much is directly observable and is the whole reason these lines exist.

         What is NOT established is the follow-on story this comment used to tell — that
         declaring an icon is also what stops the browser probing /favicon.ico and taking a
         404. It was measured and could not be reproduced: a request-logging server plus
         Chrome via playwright, headless AND headed, saw a page declaring no icon request
         "/" and nothing else. scripts/check-icons.mjs says the same at more length and
         deliberately rests on the missing icon instead. The two files disagreed until
         #746's finding was carried here; please do not reintroduce the claim.

         The PNGs are generated from favicon.svg by scripts/oneoff/render-app-icons.mjs;
         edit the SVG and re-run it rather than editing a PNG. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- Warm the connection to the database while the bundle downloads. Without this the first
         data request pays DNS + TLS only after ~400 KB of JS has parsed and the app has
         mounted. Vite substitutes %VITE_SUPABASE_URL% from the build env; in a build without
         it (seed mode) the placeholder is left as-is and the hint is a harmless no-op. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- Matches the app banner (C.surface), not the page background, so the Android
         status bar reads as an extension of the banner sitting directly below it. -->
    <meta name="theme-color" content="#161b22" />
    <!-- Declared before the stylesheet so the very first paint (and iOS's scroll indicator) is dark. -->
    <meta name="color-scheme" content="dark" />
    <!-- What a shared link shows. A ?route= or ?list= link pasted into Messages, Slack or a
         social app used to preview as a bare "ClimbMatch" with no text and no image, because
         the page carried no description at all. og:image and og:url are ABSOLUTE on purpose:
         link scrapers do not resolve a relative path, so %BASE_URL% would not do here. Like the
         manifest's paths, these are tied to the Pages address in vite.config.js's `base`. -->
    <meta name="description" content="Find climbing partners, plan your objectives and check route conditions before you go." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClimbMatch" />
    <meta property="og:title" content="ClimbMatch" />
    <meta property="og:description" content="Find climbing partners, plan your objectives and check route conditions before you go." />
    <meta property="og:url" content="https://barbs2989.github.io/Climbing-App/" />
    <meta property="og:image" content="https://barbs2989.github.io/Climbing-App/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <style>
      /* Mobile baseline */
      html { -webkit-text-size-adjust: 100%; }
      * { -webkit-tap-highlight-color: transparent; }
      body { overscroll-behavior-y: none; }
      /* WCAG 2.4.11 Focus Not Obscured. Below the desktop breakpoint (lib/wideLayout.js WIDE_MIN) the
         nav is a sticky bar at the bottom of the window, and a control scrolled into view by Tab
         could land underneath it. The padding makes the browser stop short of the bar. */
      @media (max-width: 1023px) { html { scroll-padding-bottom: calc(72px + env(safe-area-inset-bottom)); } }
      /* Buttons: kill the 300ms tap delay + double-tap zoom, add press feedback */
      button { touch-action: manipulation; font-family: inherit; }
      button:not(:disabled):active { opacity: 0.82; transform: scale(0.97); }
      /* A disabled button must LOOK disabled. 172 buttons take `disabled` and most (busy, form not
         ready) set no style for it, so they read exactly like live ones. A button that styles its own
         disabled look — a "Sent"/"Friends" confirmation sets cursor:default, a dimmed chip sets an
         inline opacity (inline outranks this rule) — keeps it. */
      button:disabled:not([style*="cursor: default"]):not([style*="cursor: not-allowed"]) { opacity: 0.5; cursor: not-allowed !important; }
      /* Smooth state changes: presses ease back, tab/selection colours & borders glide */
      button, a, input, select, textarea, [style*="cursor: pointer"] { transition: transform .09s ease, opacity .12s ease, background-color .16s ease, border-color .16s ease, color .15s ease, box-shadow .18s ease; }
      /* Tappable cards & chips (not just <button>) press in on tap. Matched by ROLE as well as
         by cursor: a clickable() control announces itself with a role, and one that never set
         cursor:pointer used to get no press feedback at all. An inline transform (a centring
         translate, a rotated chevron) is inline and so outranks this rule — it is never undone. */
      [style*="cursor: pointer"], [role="button"], [role="tab"], [role="switch"], [role="checkbox"], [role="option"], [role="menuitem"] { transition: transform .09s ease, opacity .12s ease, background-color .16s ease, border-color .16s ease, color .15s ease, box-shadow .18s ease; }
      [style*="cursor: pointer"]:not(:disabled):active, [role="button"]:not([aria-disabled="true"]):active, [role="tab"]:active, [role="switch"]:active, [role="checkbox"]:not([aria-disabled="true"]):active, [role="option"]:active, [role="menuitem"]:active { transform: scale(0.985); }
      /* ...but NOT a map pin. Leaflet places each pin by rewriting its inline `transform` every pinch
         frame and after every zoom, and a Climbs-map pin is role="button" (keyboard-reachable), so the
         two rules above eased it 0.09s behind the map: pins wobbled while pinching and slid into place
         after each zoom. Measured 16 of 16 pins carrying the transition. Leaflet's own zoom-animation
         rule (.leaflet-zoom-anim .leaflet-zoom-animated) is more specific and still wins mid-zoom. */
      .leaflet-marker-icon, .leaflet-marker-shadow { transition: none; }
      /* The map-tile credit (lib/mapKit.jsx TILE_CREDIT) — the one credit the licences require. A thin
         strip along the map's bottom edge, the full width of the map so a long credit WRAPS inside it
         rather than running under the corner buttons. Those buttons sit at bottom:26 to clear it. */
      .leaflet-bottom.leaflet-right { left: 0; }
      .leaflet-container .leaflet-bottom .leaflet-control-attribution { font-size: 9px; line-height: 1.35; padding: 1px 5px; margin: 0; background: rgba(0,0,0,0.55); color: #d6d6d6; text-align: right; }
      .leaflet-container .leaflet-bottom .leaflet-control-attribution a { color: #ffffff; }
      /* Motion — subtle life. Respect reduced-motion. */
      @keyframes cm-pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
      @keyframes cm-confetti { 0%{transform:translateY(-10px) rotate(0);opacity:1} 100%{transform:translateY(110vh) rotate(680deg);opacity:0} }
      @keyframes cm-slideup { from{transform:translateY(14px);opacity:0} to{transform:translateY(0);opacity:1} }
      @keyframes cm-fadein { from{opacity:0} to{opacity:1} }
      @keyframes cm-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(63,185,80,.45)} 70%{box-shadow:0 0 0 7px rgba(63,185,80,0)} }
      @keyframes cm-shimmer { 0%{background-position:-280px 0} 100%{background-position:280px 0} }
      .cm-shimmer { background:linear-gradient(90deg,#161b22 25%,#222a35 50%,#161b22 75%); background-size:560px 100%; animation: cm-shimmer 1.25s linear infinite; }
      @keyframes cm-spin { to{transform:rotate(360deg)} }
      .cm-spin { animation: cm-spin .7s linear infinite; }
      @keyframes cm-nudge { 0%{transform:scale(1)} 35%{transform:scale(1.25)} 100%{transform:scale(1)} }
      @keyframes cm-burst { 0%{transform:translate(-50%,0) scale(.5);opacity:0} 20%{opacity:1} 100%{transform:translate(-50%,-34px) scale(1.5);opacity:0} }
      @keyframes cm-glow { 0%,100%{box-shadow:0 0 0 0 rgba(227,179,65,0)} 50%{box-shadow:0 0 9px 0 rgba(227,179,65,.18)} }
      @keyframes cm-ring { 0%,55%,100%{transform:rotate(0)} 62%{transform:rotate(16deg)} 70%{transform:rotate(-13deg)} 78%{transform:rotate(9deg)} 86%{transform:rotate(-5deg)} }
      @keyframes cm-puff { 0%{transform:translate(-50%,0) scale(.4);opacity:.65} 100%{transform:translate(-50%,-14px) scale(2.4);opacity:0} }
      @keyframes cm-countpop { 0%{transform:translateY(2px);opacity:.4} 100%{transform:translateY(0);opacity:1} }
      .cm-nudge { animation: cm-nudge .34s cubic-bezier(.2,.8,.2,1); }
      /* Placeholder text is text (WCAG 1.4.3): #8b949e is >= 4.5:1 on every surface the app
         puts an input on. Browser defaults depend on color-scheme and can land at ~3:1, and the
         old opacity:0.6 put .cm-note at ~2.5:1. */
      ::placeholder { color: #8b949e; opacity: 1; }
      /* Keyboard focus ring (only for keyboard nav, not mouse/touch) */
      /* !important is load-bearing (WCAG 2.4.7): ~54 inputs/selects carry an inline
         outline:"none", and an inline style beats a stylesheet rule, so without it a keyboard
         user tabbing into those fields saw no focus indicator at all. */
      :focus-visible { outline: 2px solid #2f81f7 !important; outline-offset: 2px; border-radius: 5px; }
      button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }
      /* File pickers (WCAG 2.1.1). Every photo/GPX upload is a styled <label> around — or
         beside — a native file input, and those inputs were display:none: a display:none input
         cannot take focus and a label never can, so nobody on a keyboard could attach a photo
         anywhere in the app. Visually hidden instead, the input stays in the tab order and
         Enter/Space opens the picker; the ring goes on the label a sighted user sees.
         FIXED, not absolute (2026-10-24): an absolute input keeps its place in the flow but belongs
         to the nearest POSITIONED box, which inside a popup is the fixed backdrop -- so the three at
         the foot of Log a climb stretched that backdrop to 3,968px of scroll, and a drag on the
         header carried the whole popup, ✕ and all, off the screen. */
      .cm-file-input { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
      label:has(.cm-file-input:focus-visible), .cm-file-input:focus-visible + label { outline: 2px solid #2f81f7; outline-offset: 2px; }
      .cm-pop { animation: cm-pop .42s cubic-bezier(.2,.8,.2,1) both; }
      .cm-burst { animation: cm-burst .85s ease-out forwards; }
      .cm-confetti { animation: cm-confetti 1.7s linear forwards; }
      .cm-slideup { animation: cm-slideup .26s ease both; }
      .cm-fadein { animation: cm-fadein .22s ease both; }
      .cm-pulse { animation: cm-pulse 2s ease-in-out infinite; }
      .cm-glow { animation: cm-glow 2.4s ease-in-out infinite; }
      .cm-ring { animation: cm-ring 2.4s ease-in-out infinite; transform-origin: 50% 10%; display: inline-block; }
      .cm-puff { animation: cm-puff .6s ease-out forwards; }
      .cm-newitem { animation: cm-glow 1.6s ease-in-out 2; }
      /* Scrollbars you can SEE, everywhere. Nothing styled them, so the browser drew its default
         dark thumb on the app's #0d1117 background: a black bar on a near-black page, invisible
         in the feed and in every popup (Add a climb was the report). One rule on :root reaches
         every scroller because scrollbar-color is inherited. #6e7681 is 4.1:1 against the page
         and 3.8:1 against a popup's #161b22 surface (WCAG 1.4.11 asks 3:1 for a UI component).
         Chrome/Firefox read scrollbar-color; desktop Safari reads only the ::-webkit-scrollbar
         rules, which Chrome ignores wherever scrollbar-color is set, so the two never fight.
         A PHONE draws neither: iOS's overlay indicator is black unless the page declares itself
         dark, and this page never did (computed color-scheme was "normal"). color-scheme: dark
         is what turns it light -- and it also gives native pickers (date, time) the dark look
         the rest of the app already has. */
      :root { color-scheme: dark; scrollbar-color: #6e7681 transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #6e7681; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: #8b949e; background-clip: padding-box; }
      ::-webkit-scrollbar-corner { background: transparent; }
      /* Horizontal sliders: smooth touch scroll, no visible scrollbar */
      .cm-hscroll { -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .cm-hscroll::-webkit-scrollbar { display: none; width: 0; height: 0; }
      /* Staggered list entrance — children rise in one after another */
      .cm-stagger > * { animation: cm-slideup .3s ease both; }
      .cm-stagger > *:nth-child(2){animation-delay:.04s} .cm-stagger > *:nth-child(3){animation-delay:.08s}
      .cm-stagger > *:nth-child(4){animation-delay:.12s} .cm-stagger > *:nth-child(5){animation-delay:.16s}
      .cm-stagger > *:nth-child(6){animation-delay:.2s} .cm-stagger > *:nth-child(n+7){animation-delay:.24s}
      /* Bottom sheets (rounded-top containers) slide up when they open */
      [style*="18px 18px 0 0"], [style*="16px 16px 0 0"] { animation: cm-slideup .28s cubic-bezier(.2,.8,.2,1) both; }
      /* On a phone a popup FILLS THE SCREEN (owner 2026-10-23: "I don't like how some popups only show
         on the bottom of the screen"). Every bottom sheet is the same markup -- a role="dialog" backdrop
         with align-items:flex-end whose single child is the sheet -- so one rule turns all of them into
         full-screen views, the way Facebook, Strava and AllTrails open a form, a list or a share screen,
         without touching any of them. The transparent top and bottom borders keep the header out from
         under the notch and the last row above the home bar (viewport-fit=cover); the sheet's own
         background shows through them. A short ACTION MENU (a post's or a comment's ⋯) stays a bottom
         sheet, as iOS and Material both draw one: it opts out with data-sheet="menu". Desktop never
         sees this rule: lib/wideLayout.js lifts the same markup into a centred window at 1024px. */
      @media (max-width: 1023.98px) {
        [role="dialog"][style*="align-items: flex-end"]:not([data-sheet="menu"]) { align-items: stretch !important; }
        [role="dialog"][style*="align-items: flex-end"]:not([data-sheet="menu"]) > div { height: 100% !important; max-height: none !important; box-sizing: border-box !important; border-radius: 0 !important; border-left: none !important; border-right: none !important; border-top: env(safe-area-inset-top, 0px) solid transparent !important; border-bottom: env(safe-area-inset-bottom, 0px) solid transparent !important; box-shadow: none !important; overflow-y: auto; overscroll-behavior: contain; }
        /* ...and so does every CARD popup (owner 2026-10-24: "When a page pops up, I would like it to
           fill the whole screen. Like an actual page on itself"). Settings, Feedback, Privacy, About us,
           a climber's profile, Log a climb, a trip report and the rest were a rounded card centred, or
           pinned near the top, over the dimmed page -- a backdrop with align-items:center or flex-start
           and the card as its child. Here the card becomes the page: the full height of the screen, the
           app's 520px column wide, its own scroller. Material keeps a small centred dialog for an ALERT
           alone (a yes/no about something urgent), so the delete-account confirm opts out with
           data-sheet="alert"; the photo viewers are already a black full-screen lightbox and opt out with
           data-sheet="viewer". */
        [role="dialog"][style*="align-items: center"]:not([data-sheet]), [role="dialog"][style*="align-items: flex-start"]:not([data-sheet]) { align-items: stretch !important; padding: 0 !important; }
        [role="dialog"][style*="align-items: center"]:not([data-sheet]) > div, [role="dialog"][style*="align-items: flex-start"]:not([data-sheet]) > div { width: 100% !important; max-width: 520px !important; height: 100% !important; min-height: 0 !important; max-height: none !important; margin: 0 !important; box-sizing: border-box !important; border-radius: 0 !important; border-left: none !important; border-right: none !important; border-top: env(safe-area-inset-top, 0px) solid transparent !important; border-bottom: env(safe-area-inset-bottom, 0px) solid transparent !important; box-shadow: none !important; overflow-y: auto !important; overscroll-behavior: contain; }
      }
      /* Links dim on press rather than shrink — scaling a run of inline text reads as a glitch. */
      a[href]:active { opacity: 0.7; }
      /* Switch knobs SLIDE between off and on instead of teleporting. The knob is the switch's
         only child and is positioned by an inline left:3 / left:23. */
      [role="switch"] > * { transition: left .18s cubic-bezier(.2,.8,.2,1); }
      /* Reduced motion switches off MOTION, never layout. This used to be `* { transform: none
         !important }`, which also stripped the translate(-50%) that centres the fix prompt and the
         lightbox's Remove button, knocked the password eye out of its field, and froze the
         swipe-to-delete row under the finger. The press rules are restated here WITHOUT
         !important, so they win over the scale above (same selector, later) and still lose to an
         element's own inline transform. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
        [role="switch"] > * { transition: none; }
        button:not(:disabled):active, [style*="cursor: pointer"]:active, [role="button"]:not([aria-disabled="true"]):active, [role="tab"]:active, [role="switch"]:active, [role="checkbox"]:not([aria-disabled="true"]):active, [role="option"]:active, [role="menuitem"]:active { transform: none; }
      }
      /* 16px inputs so iOS doesn't auto-zoom the page when a field is focused */
      input, textarea, select { font-size: 16px !important; }
      /* ONE dropdown chevron for every <select>, on every screen. This rule used to live in a <style>
         that App renders inside its MAIN return only, so every screen App returns EARLY (Edit
         profile, the Calendar, the guide dashboard, the legal pages, sign-in) drew the browser's own
         arrow -- black on the app's near-black field, which is how Edit profile's state picker was
         reported as unreadable. In the document head it reaches them all. !important beats the
         inline `background:` shorthand most selects carry, which would otherwise reset the image.
         #2f81f7 is 4.6:1 on #161b22 (WCAG 1.4.11 asks 3:1 of a control's graphics). A list box
         (multiple / size) draws no arrow, so it is left alone. */
      /* ...and a 44px minimum height (Apple's touch minimum). A select opens only on a tap that hits
         it -- lib/tapSlop.js cannot open a native picker for a touch beside it -- and the probe
         (scripts/oneoff/probe-tap-targets.mjs) measured them at 33-37px: Ranks' two pickers, the
         Planner's fitness and departure time, Settings' date format, onboarding's grades. Not
         !important, so a select that sets its own minHeight inline keeps it. */
      select:not([multiple]):not([size]) { min-height: 44px; }
      select:not([multiple]):not([size]) { -webkit-appearance: none !important; -moz-appearance: none !important; appearance: none !important; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%232f81f7%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E') !important; background-repeat: no-repeat !important; background-position: right 12px center !important; background-size: 10px !important; padding-right: 34px !important; }
      /* iOS Safari draws a date/time input as a native control with its OWN minimum width and
         ignores width:100%, so DATE CLIMBED ran past the right edge of its card and its value sat
         centred inside a box wider than every field around it. Dropping the native appearance
         (touch devices only — desktop keeps its picker icon) lets it take the width it is given. */
      @supports (-webkit-touch-callout: none) {
        input[type="date"], input[type="time"], input[type="datetime-local"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; min-height: 38px; }
        input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
      }
      .cm-fsm { font-size: 13px !important; }
      /* Route/area cover photos hidden for now (pairs with SHOW_COVERS in ClimbMatch.jsx).
         Hide the image, and collapse boxes whose only child is the image so cards don't
         leave an empty gap. Banner/header overlays (back button, badges) are preserved. */
      .cover-x { display: none !important; }
      *:has(> .cover-x:only-child) { display: none !important; }
      /* Boot placeholder — the app shell, drawn from inline HTML/CSS while the JS
         bundle downloads and React mounts. On a slow phone that gap is several
         seconds, and #root was empty for all of it: a black screen with no sign
         the app was coming. React's createRoot clears this on first render.
         Mirrors the real banner + bottom primary nav (same colours, paddings and item
         height) so the swap doesn't shift layout. Only the chrome that is
         genuinely about to appear is drawn — content areas are neutral shimmer,
         never placeholder numbers or names. */
      #cm-boot { max-width: 520px; margin: 0 auto; min-height: 100vh; background: #0d1117; display: flex; flex-direction: column; }
      #cm-boot .b-bar { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 12px; padding-top: calc(16px + env(safe-area-inset-top)); }
      #cm-boot .b-icons { display: flex; justify-content: flex-end; gap: 9px; }
      #cm-boot .b-icons i { width: 36px; height: 36px; border-radius: 10px; border: 1px solid #30363d; background: #1c2330; display: block; }
      #cm-boot .b-mark { font-size: 35px; font-weight: 800; letter-spacing: -0.7px; text-align: center; color: #e6edf3; line-height: 1.1; }
      #cm-boot .b-mark span { color: #2f81f7; }
      #cm-boot .b-nav { display: flex; background: rgba(22,27,34,0.82); -webkit-backdrop-filter: saturate(160%) blur(16px); backdrop-filter: saturate(160%) blur(16px); box-shadow: 0 -1px 0 rgba(240,246,252,0.06), 0 -10px 30px rgba(0,0,0,0.35); position: sticky; bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
      #cm-boot .b-nav div { flex: 1; min-width: 0; padding: 11px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: min(12.5px, 2.95vw); font-weight: 600; color: #99a3ad; }
      #cm-boot .b-nav div:first-child { color: #2f81f7; font-weight: 800; }
      #cm-boot .b-nav b { width: 24px; height: 24px; border-radius: 6px; background: #21262d; margin: 3px 13px; display: block; }
      #cm-boot .b-nav div:first-child b { background: #0d2044; }
      /* LOADING SCREEN. A branded splash over the boot shell -- the mark, the wordmark and a moving
         bar -- the way a native app opens, instead of a skeleton that reads as a half-drawn page.
         The shell underneath stays (check:boot keeps it matched to NAV). React draws the SAME splash
         (lib/BootSplash.jsx) while it restores the session, so the hand-over does not flash. */
      #cm-splash { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(120% 70% at 50% 0%, #10264a 0%, #0d1117 62%); padding-bottom: env(safe-area-inset-bottom); }
      #cm-splash svg { width: 92px; height: 92px; filter: drop-shadow(0 10px 28px rgba(47,129,247,0.35)); }
      #cm-splash .s-word { font-size: 32px; font-weight: 800; letter-spacing: -0.7px; color: #e6edf3; }
      #cm-splash .s-word span { color: #2f81f7; }
      #cm-splash .s-tag { font-size: 14px; color: #99a3ad; margin-top: -6px; }
      #cm-splash .s-bar { width: 132px; height: 4px; border-radius: 2px; background: #21262d; overflow: hidden; margin-top: 18px; }
